[tox]
envlist = py310,lint
skipsdist = true

[testenv]
deps =
    -rrequirements.txt
    pytest
commands = python -m pytest {posargs}

[testenv:lint]
deps =
    ruff
    ty
    -rrequirements.txt
    requests
    python-docx
    reportlab
    pytest
skip_install = true
commands =
    ruff check .
    ty check
